[project]
name = "syncora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "jaydebeapi>=1.2.3",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "pypdf2>=3.0.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "reportlab>=4.5.1",
    "requests>=2.34.2",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "prek>=0.4.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
